# Weekly: delete the media files of posts that are already live (agent/social/cleanup.py).
# Captions, dates and the Instagram/Facebook links stay in marketing/queue as the record.
name: cleanup

on:
  schedule:
    - cron: "17 2 * * 1"   # Mondays 06:17 Dubai
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-inbox    # same group as the publisher, so their commits never collide
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python -m agent.social.cleanup
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A marketing media reels/public
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Cleanup: remove media of posted items"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
