# Sends a test message to Jabir's Telegram using both secrets (same path as the daily report).
name: telegram-test

on:
  push:
    paths:
      - ops/telegram-test.trigger
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: >
          uv run python -m agent.notify.telegram
          "🎉 Hi Jabir! Your AZMIN Marketing OS is connected.
          From now on I'll send your daily 9 AM report and the weekly content for approval here."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
