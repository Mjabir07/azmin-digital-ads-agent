[project]
name = "azmin-ads-agent"
version = "0.1.0"
description = "AZMIN DIGITAL Meta ads agent - Phase 1 read-only daily report"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14",
    "google-auth",
    "gspread>=6.2",
    "httpx>=0.28",
    "pyyaml",
]

[dependency-groups]
creatives = [
    "pillow>=12.3.0",
    "playwright>=1.55",
]
dev = ["pytest"]
voice = [
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
