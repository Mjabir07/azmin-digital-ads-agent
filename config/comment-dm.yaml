# Comment keyword -> free guide by DM ("AI Tools with Yara").
# The publisher (every 5 min) reads new comments on our Instagram posts from the last 7 days.
# When a comment contains a keyword below:
#   mode: alert -> Jabir gets a Telegram message with the comment, the guide link and the DM text to send by hand.
#   mode: auto  -> the agent sends the fixed DM below as an Instagram private reply (one per comment, Meta's
#                  rule) and answers the comment publicly. If Meta refuses, it falls back to the Telegram alert.
# Auto needs the system-user token to have instagram_manage_messages (docs/SETUP-COMMENT-DM.md).
# Only the fixed text below is ever sent: no AI-written DMs, no prices.
mode: auto
max_per_run: 25          # safety cap so a viral post can't trigger a burst Meta might flag as spam
lookback_days: 7         # Meta allows private replies up to 7 days after the comment

# Follow gate (Jabir 27 Oct: only followers get the guide, to grow the page). The first DM asks them to follow
# and reply DONE; when they reply, the agent checks the follow with Instagram, then sends dm_text (the guide),
# or not_following_text (max max_nudges times; after that Jabir gets a Telegram note).
# 27 Oct: OFF. Live test showed Meta blocks the follow-up DM ((#10) outside window, (#230) consent) while the
# app is in development mode, so the guide goes in the first DM with a follow ask. Turn on after App Review.
follow_gate: false
max_nudges: 2
gate_text: |-
  Hi! 👋 Your free guide "{title}" is ready.

  1️⃣ Follow @azmin_digital (a new AI tip every day)
  2️⃣ Reply DONE here and I'll send it straight away 📄
not_following_text: |-
  I can't see your follow yet 🙂 Please follow @azmin_digital, then reply DONE again and the guide is yours.

dm_text: |-
  Hi! 👋 Here's your free guide from AI Tools with Yara: {title}

  📄 {link}

  ➕ Follow @azmin_digital so you don't miss tomorrow's AI tip (a new one every day).
  Need a website or an AI assistant for your business? Just reply here. – AZMIN DIGITAL

public_replies:          # one is picked per comment, only after the first DM was sent
  - "Sent! Check your DMs 📩 (or Message requests)"
  - "Done ✅ Check your DMs (or Message requests) 📩"
  - "On its way 📩 Check your DMs or Message requests"

keywords:
  SKILL:
    match: [skill, skills]
    title: "find-skills, step by step"
    guide: marketing/guides/find-skills.pdf
