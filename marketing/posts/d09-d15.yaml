  # Day 13 (Fri) carousel — Meta ads mistakes
  - name: d13-c1
    kind: cover
    kicker: META ADS
    title: "5 mistakes that *burn* your ad budget"
    sub: "Facebook & Instagram ads for small businesses."
  - name: d13-c2
    kind: point
    count: 02/07
    num: "01"
    title: "No clear *audience*"
    body: "Say who it's for in the first line. \"For UAE business owners\" filters out the wrong clicks."
  - name: d13-c3
    kind: point
    count: 03/07
    num: "02"
    title: "Editing *too soon*"
    body: "Meta needs a few days to learn. Big changes in the first days restart the learning."
  - name: d13-c4
    kind: point
    count: 04/07
    num: "03"
    title: "Only *one* ad"
    body: "Test a few different ideas: a video, an image, an offer. Let the results decide."
  - name: d13-c5
    kind: point
    count: 05/07
    num: "04"
    title: "Paying for the wrong *placements*"
    body: "Check where your messages come from and stop paying for places that bring none."
  - name: d13-c6
    kind: point
    count: 06/07
    num: "05"
    title: "No *follow-up*"
    body: "Most people don't buy on day one. Reply fast, then follow up a few days later."
