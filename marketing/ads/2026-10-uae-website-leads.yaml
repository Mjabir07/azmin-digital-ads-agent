# First campaign: UAE business owners → WhatsApp chats about the AED 999 Starter Combo.
# Built PAUSED by agent/ads/launch.py; Jabir activates with ✅ in Telegram. Limits: config/limits.yaml.
# Jabir 2026-10-18: AED 50/day, AED 200 total for the first test (about 4 days).
campaign:
  name: "AZD | UAE | WhatsApp Leads | Website Design"
  objective: OUTCOME_ENGAGEMENT
prefill_message: "Hi! I have a business and I'm interested in the AED 999 website."
targeting_base:
  cities: ["Dubai", "Sharjah", "Abu Dhabi", "Ajman"]
  location_types: [home]                 # people who live there, not tourists/visitors
  age_min: 27
  age_max: 55
  locales: ["English (All)", "Arabic"]
  placements:                            # no Audience Network / Messenger
    publisher_platforms: [facebook, instagram]
    facebook_positions: [feed, story, facebook_reels]
    instagram_positions: [stream, story, reels]
owner_signals:
  behaviors: ["Small business owners", "Facebook page admins"]
  interests: ["Entrepreneurship", "Small business", "Startup company", "E-commerce", "Digital marketing", "Online advertising"]
adsets:
  - name: "Owners strict | 27-55"
    lifetime_budget_aed: 200       # hard total: Meta never spends more than this (about AED 50/day)
    start: "2026-10-19 08:00"      # Dubai time; ads only run between start and end
    end: "2026-10-23 08:00"
    advantage_audience: false
ads:
  - name: "Yara-AI-Chatbot-Reel"
    replaces: "Yara-Offer-Reel"          # Jabir 2026-10-18: use the reel already posted on Instagram
    video: marketing/reels/yara-ai-chatbot-w02.mp4
    prefill_message: "Hi! I have a business and I'm interested in an AI WhatsApp chatbot."
    primary_text: |
      For UAE business owners 👋 Missing customer messages at night?

      An AI chatbot on your WhatsApp answers customers instantly, even at 2 AM: hours, services, bookings, FAQs.
      We set it up and train it on your business. Tap to chat with us.
    headline: "AI chatbot for your WhatsApp"
  - name: "MeVsMe-Reel"
    video: marketing/reels/yara-me-vs-me-w02.mp4
    primary_text: |
      Business owner in the UAE? "My Instagram page is enough" is costing you customers.

      Customers check Google first. A website makes you look trusted and easy to find.
      Website + free domain + 1 year hosting, from AED 999. Ready in as little as 1 day.
    headline: "Get found on Google"
  - name: "Offer-Image"
    image: marketing/posts/d03-d08/d07-post.jpg
    primary_text: |
      For UAE business owners: your business website, ready in as little as 1 day ⚡

      Starter Combo from AED 999: business website, free domain, 1 year hosting.
      Mobile-friendly, WhatsApp button, Google-ready. Message us to get started.
    headline: "Starter Combo · AED 999"
